minimum_pre_commit_version: "3.5.0"

# pre-commit.ci does not provision Cargo for `language: system` hooks. GitHub
# Actions installs the Rust toolchain before running this same configuration.
ci:
  skip: [cargo-fmt, cargo-clippy, cargo-test]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets --all-features --locked
        language: system
        pass_filenames: false
        types: [rust]
