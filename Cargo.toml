[package]
name = "choretui"
version = "0.1.0"
edition = "2024"
description = "A local, keyboard-driven TUI for recurring weekly chores"
repository = "https://github.com/ibirothe/choreTUI"
rust-version = "1.88"

[[bin]]
name = "chore"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
