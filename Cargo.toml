[package]
name = "choretui"
version = "0.1.0"
edition = "2024"
description = "A local, keyboard-driven TUI for recurring weekly chores"
repository = "https://github.com/ibirothe/choreTUI"
rust-version = "1.88"

[[bin]]
name = "chore"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
proptest = "1.9.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
